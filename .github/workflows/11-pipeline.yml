name: Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ./part11-cicd/fs-pokedex
        run: npm install
      - name: Lint code
        working-directory: ./part11-cicd/fs-pokedex
        run: npm run eslint
      - name: Run unit tests
        working-directory: ./part11-cicd/fs-pokedex
        run: npm run test
      - name:  Install Playwright Browsers
        working-directory: ./part11-cicd/fs-pokedex
        run: npx playwright install --with-deps
      - name: Run e2e tests
        working-directory: ./part11-cicd/fs-pokedex
        run: npm run test:e2e
      - name: Build code
        working-directory: ./part11-cicd/fs-pokedex
        run: npm run build
      - name: Deploy to Render
        run: curl ${{ secrets.RENDER_DEPLOY_SECRET }}